<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Start</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="bg" width="1920" height="1080"></canvas>

  <nav id="shortcuts"></nav>

  <section id="clock">
    <div id="time"></div>
    <div id="date"></div>
  </section>

  <main id="dock"></main>

  <div id="toast" class="hidden"></div>

  <section id="diag" class="hidden">
    <h2>Diagnostics <small>▲ ▼ scroll · Back / Blue close</small></h2>
    <pre id="diag-text"></pre>
  </section>

  <script src="js/logos.js"></script>
  <script src="js/tiles.js"></script>
  <script src="js/background.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
