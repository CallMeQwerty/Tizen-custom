<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Start</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div id="clock">--:--</div>
    <div id="date"></div>
  </header>

  <main id="grid"></main>

  <footer>
    <span>◀ ▶ ▲ ▼ move · OK open · 1–7 quick open · Blue = diagnostics</span>
    <span id="status"></span>
  </footer>

  <div id="toast" class="hidden"></div>

  <section id="diag" class="hidden">
    <h2>Diagnostics <small>▲ ▼ scroll · Back / Blue close</small></h2>
    <pre id="diag-text"></pre>
  </section>

  <script src="js/tiles.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
